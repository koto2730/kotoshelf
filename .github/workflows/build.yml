# Phase 0 CI: build the desktop bundle on every push to main and every PR
# targeting main. Uploads the per-OS bundles as workflow artifacts so we
# can verify the whole build chain (Rust + Vite + Tauri packaging) works
# on all three targets before we invest in a release workflow.
#
# Linux is pinned to ubuntu-22.04 for the same glibc-compat reason as
# kotomemo — build against 22.04's glibc 2.35 so the AppImage runs on
# any still-supported LTS distro.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Builds the SSH agent binary (see agent/, agent-protocol/ - the
  # SSH-perf plan's persistent remote agent) for every *remote* target
  # kotoshelf can connect to, independent of which *desktop* OS is
  # building the app below - a Windows build of kotoshelf still needs to
  # be able to deploy a Linux or macOS agent when the user connects to
  # one. Every build job downloads all of these and bundles them all in,
  # regardless of its own platform.
  build-agents:
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            platform: ubuntu-22.04
          - triple: aarch64-unknown-linux-gnu
            platform: ubuntu-22.04
            cross: true
          - triple: aarch64-apple-darwin
            platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./agent -> target"

      # Linux ARM64 is the one target here that isn't native to its
      # runner - ubuntu-22.04 runners are x86_64, so this cross-compiles
      # via a separate aarch64 gcc/linker rather than building on real
      # ARM hardware.
      - name: Install aarch64 cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure aarch64 cross linker
        if: matrix.cross
        run: |
          mkdir -p .cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> .cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> .cargo/config.toml

      - name: Build agent
        run: cargo build --release --manifest-path agent/Cargo.toml --target ${{ matrix.triple }}

      - name: Upload agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.triple }}
          path: agent/target/${{ matrix.triple }}/release/kotoshelf-agent
          if-no-files-found: error

  build:
    needs: build-agents
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: linux
          - platform: macos-latest
            label: macos-arm64
          - platform: windows-latest
            label: windows
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      # Cache the Rust target dir so incremental CI stays reasonably fast.
      # First run cold-builds ~5 min for tauri deps; subsequent runs
      # normally finish in ~1-2 min.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Tauri v2 needs webkit2gtk 4.1 headers plus a handful of X11/librsvg
      # bits on Linux. Missing any of these fails silently at link time.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install frontend deps
        run: npm ci

      # Every desktop build embeds every remote-target agent, not just a
      # build matching its own platform (a Windows kotoshelf still needs
      # to deploy a Linux/macOS agent to whatever it connects to). Local
      # execute permissions on these staged files don't matter -
      # ssh_agent_connect only ever reads their bytes to upload them, the
      # remote side is what gets chmod +x'd.
      - name: Download agent binaries
        uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: agent-artifacts

      - name: Stage agent binaries for bundling
        run: |
          mkdir -p src-tauri/agent-bin
          for dir in agent-artifacts/agent-*; do
            triple="$(basename "$dir" | sed 's/^agent-//')"
            mkdir -p "src-tauri/agent-bin/$triple"
            cp "$dir/kotoshelf-agent" "src-tauri/agent-bin/$triple/kotoshelf-agent"
          done
          find src-tauri/agent-bin -type f

      - name: Tauri build
        run: npm run tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: kotoshelf-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
