# Phase 0 CI: build the desktop bundle on every push to main and every PR
# targeting main. Uploads the per-OS bundles as workflow artifacts so we
# can verify the whole build chain (Rust + Vite + Tauri packaging) works
# on all three targets before we invest in a release workflow.
#
# Linux is pinned to ubuntu-22.04 for the same glibc-compat reason as
# kotomemo — build against 22.04's glibc 2.35 so the AppImage runs on
# any still-supported LTS distro.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: linux
          - platform: macos-latest
            label: macos-arm64
          - platform: windows-latest
            label: windows
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      # Cache the Rust target dir so incremental CI stays reasonably fast.
      # First run cold-builds ~5 min for tauri deps; subsequent runs
      # normally finish in ~1-2 min.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Tauri v2 needs webkit2gtk 4.1 headers plus a handful of X11/librsvg
      # bits on Linux. Missing any of these fails silently at link time.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install frontend deps
        run: npm ci

      - name: Tauri build
        run: npm run tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: kotoshelf-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
