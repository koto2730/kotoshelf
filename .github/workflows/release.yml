# Release: triggered by pushing a v* tag. Builds on the same 3-OS matrix
# as build.yml, then uses Tauri's official action to create a GitHub
# Release as a DRAFT and attach each OS's installer.
#
# Draft only - nothing here auto-publishes. Bump the version in
# package.json / src-tauri/tauri.conf.json / src-tauri/Cargo.toml before
# tagging; tauri-action reads tauri.conf.json's version to name the
# bundled installers (unlike kotomemo's jpackage, Tauri/WiX has no
# MAJOR>0 constraint, so 0.0.x tags work as-is).
#
# Re-tagging an existing version number is safe - tauri-action updates
# the existing draft release rather than failing like kotomemo's
# `gh release create` does.

name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: macos-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install frontend deps
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
